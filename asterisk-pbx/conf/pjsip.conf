;; Transport
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;; ============ Local Endpoints ============

;; Alice
[alice]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
auth=alice-auth
aors=alice
direct_media=no

[alice-auth]
type=auth
auth_type=userpass
username=alice
password=alice123

[alice]
type=aor
max_contacts=1

;; Bob
[bob]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
auth=bob-auth
aors=bob
direct_media=no

[bob-auth]
type=auth
auth_type=userpass
username=bob
password=bob123

[bob]
type=aor
max_contacts=1

;; ============ Trunk to Proxy ============

[proxy-trunk]
type=endpoint
context=from-proxy
disallow=all
allow=ulaw
aors=proxy-trunk-aor
direct_media=no

[proxy-trunk-aor]
type=aor
contact=sip:asterisk-proxy:5060

[proxy-trunk-identify]
type=identify
endpoint=proxy-trunk
match=10.99.0.11/32
