[from-internal]
;; Calls from local endpoints route through the proxy trunk
exten => bob,1,NoOp(Routing call to bob via proxy)
 same => n,Dial(PJSIP/bob@proxy-trunk)
 same => n,Hangup()

exten => alice,1,NoOp(Routing call to alice via proxy)
 same => n,Dial(PJSIP/alice@proxy-trunk)
 same => n,Hangup()

[from-proxy]
;; Calls returning from proxy — deliver to local endpoint
exten => bob,1,NoOp(Delivering call to bob from proxy)
 same => n,Dial(PJSIP/bob)
 same => n,Hangup()

exten => alice,1,NoOp(Delivering call to alice from proxy)
 same => n,Dial(PJSIP/alice)
 same => n,Hangup()
